[project]
name = "flow_planning"
version = "0.1.0"
description = "Flow Planning Project"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
  "lerobot>=0.5.1",
  "newton[examples]",
  "pre-commit>=4.6.0",
  "rerun-sdk>=0.26.2",
  "slurm-tools",
  "torch>=2.10.0",
  "ty>=0.0.46",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]
slurm-tools = { git = "https://github.com/reeceomahoney/slurm-tools.git" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff.lint]
select = ["E", "F", "I"]
