[project]
name = "flow_planning"
version = "0.1.0"
description = "Flow Planning Project"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["hf-libero>=0.1.4,<0.2", "newton[examples]>=1.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = [{ platform = "linux-64", glibc = "2.31" }]

[tool.pixi.dependencies]
libegl = "*"
libgl = "*"
ffmpeg = ">=8.1.2,<9"
cmake = ">=4.4.2,<5"

[tool.pixi.pypi-dependencies]
flow_planning = { path = ".", editable = true }
lerobot = { version = ">=0.6.1, <0.7", extras = [
  "dataset",
  "hardware",
  "viz",
  "intelrealsense",
] }
lerobot_robot_piper = { git = "https://github.com/reeceomahoney/lerobot-piper", subdirectory = "lerobot_robot_piper" }
lerobot_teleoperator_piper = { git = "https://github.com/reeceomahoney/lerobot-piper", subdirectory = "lerobot_teleoperator_piper" }
newton = { version = "==1.4.0", extras = ["examples"] }
pre-commit = ">=4.6.0"
pytorch-volumetric = ">=0.6.0"
rerun-sdk = ">=0.26.2"
scipy = ">=1.17"
skypilot = { version = ">=0.12.3.post1", extras = ["kubernetes", "vast"] }
vastai-sdk = ">=1.5"
slurm-tools = { git = "https://github.com/reeceomahoney/slurm-tools.git" }
torchcodec = { version = ">=0.12", index = "https://download.pytorch.org/whl/cu130" }
ty = ">=0.0.46"
wandb = ">=0.24.2"

[tool.pixi.pypi-options.dependency-overrides]
torch = { version = ">=2.11.0", index = "https://download.pytorch.org/whl/cu130" }
mujoco = "==3.10.0"
mujoco-warp = "==3.10.0.3"
torchvision = { version = ">=0.27", index = "https://download.pytorch.org/whl/cu130" }
torchcodec = { version = ">=0.12", index = "https://download.pytorch.org/whl/cu130" }

[tool.pixi.tasks]
video = "python scripts/record.py --record False --episodes 1 --env.type franka --env.world_count 1 --video out.mp4"
record = "lerobot-record --config_path=configs/record.yaml"
rollout = "lerobot-rollout --config_path=configs/rollout.yaml --discover_packages_path=flow_planning"

[tool.pixi.tasks.vast]
args = [{ "arg" = "exec", "default" = "" }]
cmd = """
{%- if exec -%}
sky exec vast configs/vast.yaml -d --env HF_TOKEN --env WANDB_API_KEY
{%- else -%}
sky launch configs/vast.yaml -c vast -y -d --env HF_TOKEN --env WANDB_API_KEY; python scripts/vast_guard.py || sky down vast -y
{%- endif -%}
"""

[tool.pixi.tasks.launch]
args = [{ "arg" = "cluster_id", "default" = "" }]
cmd = """
{%- if cluster_id -%}
sky exec {{ cluster_id }} configs/sky.yaml --env HF_TOKEN --env WANDB_API_KEY
{%- else -%}
sky launch configs/sky.yaml -c flow -y --env HF_TOKEN --env WANDB_API_KEY
{%- endif -%}
"""

[tool.ruff.lint]
select = ["E", "F", "I"]

# warp's kernel DSL confuses type checkers
[[tool.ty.overrides]]
include = [
  "flow_planning/envs/contact.py",
  "flow_planning/envs/particle.py",
  "flow_planning/envs/franka.py",
  "flow_planning/envs/libero.py",
]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
invalid-type-form = "ignore"
missing-argument = "ignore"
no-matching-overload = "ignore"
not-subscriptable = "ignore"
unresolved-attribute = "ignore"
unsupported-operator = "ignore"
