name: flow-planning

resources:
  infra: ssh/ori
  accelerators: RTX4090:2
  cpus: 30

envs:
  HF_TOKEN:
  WANDB_API_KEY:
  CUDA_VISIBLE_DEVICES: 1
workdir: .

setup: |
  curl -LsSf https://astral.sh/uv/install.sh | sh
  source $HOME/.local/bin/env
  cd ~/sky_workdir && uv sync

run: |
  set -e
  # snapshot first: a parallel session re-syncing ~/sky_workdir clobbers us mid-job
  JOB=~/job
  rm -rf $JOB
  rsync -a --exclude .venv --exclude outputs --exclude wandb ~/sky_workdir/ $JOB/
  cd $JOB && uv sync
  # ponytail: logs which code ran instead of asserting it; the snapshot above is
  # the real protection, this just attributes a surprising result after the fact
  git rev-parse --short HEAD 2>/dev/null || echo "no git"

  CKPT=/home/sky/v12job/outputs/franka/2026-07-06/18-21-13
  GRID="0,0,0.15,0.28;0,0,0.45,0.28;-0.85,0,0.15,0.28;-0.85,0,0.45,0.28;0,0.6,0.45,0.28;0,0.6,0.15,0.28"
  E="uv run scripts/eval.py --repo_id reece-omahoney/franka --episodes 2 \
    --env.type franka --env.task_time 1.5 --episode_seconds 30 --checkpoint $CKPT \
    --n_action_steps 75 --env.obstacle true --env.sample_wall_margin 0.15 \
    --warm_start_t 0.6 --cond search --selector_cap 0.10 --selector_prog 0.01 \
    --best_of 16"
  # round 10: margin 0.04 was a category error — for SELECTION it is a filter
  # threshold (saturates at 0.04); for GUIDANCE it is a push target and must sit
  # ABOVE the needed clearance so execution drift does not eat it. Round 9 at
  # 0.04 gave failure 0.40 vs July's 0.027 at margin 0.10. Back to 0.10, keeping
  # the one change that worked (x1 target beat xt 0.508 vs 0.164 at matched
  # margin). Arm D is July's exact peak config plus ONLY the length term, which
  # isolates whether the length term fixes its 0.25 timeout.
  G="--cond search --n_cond 6 --best_of 1 --selector_margin 0.04 --guidance_margin 0.10"
  echo "=== A: x1, scale 0.3, no length ==="
  $E $G --guidance_target x1 --guidance_scale 0.3
  echo "=== B: x1, scale 0.3, length 0.3 ==="
  $E $G --guidance_target x1 --guidance_scale 0.3 --guidance_len 0.3
  echo "=== C: x1, scale 1.0, length 0.3 ==="
  $E $G --guidance_target x1 --guidance_scale 1.0 --guidance_len 0.3
  echo "=== D: xt scale 0.3 + length 0.3 — July's peak config, length term only ==="
  $E $G --guidance_target xt --guidance_scale 0.3 --guidance_len 0.3
