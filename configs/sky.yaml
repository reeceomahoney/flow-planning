name: flow-planning

resources:
  infra: ssh/ori
  accelerators: RTX4090:2
  cpus: 30

envs:
  HF_TOKEN:
  WANDB_API_KEY:
  CUDA_VISIBLE_DEVICES: 1
workdir: .

setup: |
  curl -fsSL https://pixi.sh/install.sh | sh
  export PATH="$HOME/.pixi/bin:$PATH"
  cd ~/sky_workdir && pixi install

run: |
  set -e
  export PATH="$HOME/.pixi/bin:$PATH"
  export LD_LIBRARY_PATH="$PWD/.pixi/envs/default/lib:$LD_LIBRARY_PATH"

  rm -rf ~/.cache/huggingface/lerobot/reece-omahoney/franka
  pixi run python scripts/record.py --env.type franka --env.world_count 256 --env.task_time 1.5 --episodes 768
  pixi run python scripts/train.py --num_iters 75000 --env.type franka --env.task_time 1.5
