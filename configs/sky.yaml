name: flow-planning

resources:
  infra: ssh/ori
  accelerators: RTX4090:1
  cpus: 31

envs:
  HF_TOKEN:
  WANDB_API_KEY:
  CUDA_VISIBLE_DEVICES: 1
  MUJOCO_GL: egl
  HF_DATASETS_DISABLE_PROGRESS_BARS: 1
  CMAKE_POLICY_VERSION_MINIMUM: 3.5
  SMOKE: 0
  ITERS: 40000
  TAG: pose_s1
workdir: .

setup: |
  curl -fsSL https://pixi.sh/install.sh | sh
  export PATH="$HOME/.pixi/bin:$PATH"
  cd ~/sky_workdir && pixi install

run: |
  export PATH="$HOME/.pixi/bin:$PATH"
  SNAP=$(mktemp -d ~/snap.XXXXXX)
  rsync -a --exclude .pixi --exclude outputs --exclude wandb ~/sky_workdir/ $SNAP/
  ln -s ~/sky_workdir/.pixi $SNAP/.pixi; mkdir -p ~/sky_workdir/outputs; ln -s ~/sky_workdir/outputs $SNAP/outputs
  cd $SNAP
  grep -q posture_copies scripts/augment.py || { echo "stale workdir"; exit 1; }
  export LD_LIBRARY_PATH="$PWD/.pixi/envs/default/lib:$LD_LIBRARY_PATH"
  CACHE=~/.cache/huggingface/lerobot/reece-omahoney
  ENV="--env.type libero --env.suite safelibero_spatial --env.task_onehot 4 --env.n_action_steps 10"
  q() { "$@" 2>&1 | grep --line-buffered -vE "it/s|Warning|examples/s|EGL|egl_|OpenGL|glCheck|binding_utils|raise self|^\s*$"; }
  REPO=spatial_pose; RUN=outputs/libero/spatial_pose_s1
  [ -d $CACHE/$REPO ] || q pixi run python scripts/augment.py $ENV --env.level I --task_ids "[0,1,2,3]" --dst_repo reece-omahoney/$REPO \
    --n_seg 1 --bend_margin 0.4 --focus true --retarget 0.25 --retarget_place 0.12 --retarget_only 0.15 \
    --copies 8 --orig_copies 5 --ik_iters 32 --ik_tol 0.01 --vel_frac 0.8 --ik_tol_aug 0.05 --vel_frac_aug 1.5 \
    --alphas "[0,90]" --alpha_prob 0.4 --alpha_tasks "[0,1]" --postures 4
  echo "##### train $RUN"
  [ -f $RUN/model.safetensors ] || q pixi run python scripts/train.py $ENV --repo_id reece-omahoney/$REPO \
    --horizon 50 --num_iters $ITERS --eval_every 0 --balance_tasks true --seed 1 --run_dir $RUN
  ev() { echo "##### $1"; shift; pixi run python scripts/eval.py $ENV --env.world_count 10 --episodes 5 \
    --repo_id reece-omahoney/$REPO --checkpoint $RUN "$@" 2>&1 | grep -E "^overall|Error|Traceback|File \"/home"; }
  TIGHT="--cond search --n_cond 8 --resample true --ensemble 3 --ensemble_m 0.7 --cbf true --cbf_chunk true --cbf_init 20 --cbf_hold 0.09 --cbf_geoms true --cbf_axes 0.04,0.11,0.075 --cbf_offset 0,0,-0.056 --cbf_margin 0.0"
  for T in 0 1 2 3; do for L in I II; do
    ev "task $T level $L tight" --env.task_id $T --env.level $L --env.obstacle true $TIGHT
    ev "task $T level $L arm" --env.task_id $T --env.level $L --env.obstacle true $TIGHT --cbf_arm 4,5,6
  done; done
  for T in 0 1 2 3; do ev "task $T free zero" --env.task_id $T --env.obstacle false --cond zero --ensemble 3 --ensemble_m 0.7; done
  rm -rf $SNAP
