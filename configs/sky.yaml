name: flow-planning

resources:
  infra: ssh/ori
  accelerators: RTX4090:2
  cpus: 30

envs:
  HF_TOKEN:
  WANDB_API_KEY:
  CUDA_VISIBLE_DEVICES: 1
workdir: .

setup: |
  curl -LsSf https://astral.sh/uv/install.sh | sh
  source $HOME/.local/bin/env
  cd ~/sky_workdir
  uv sync

run: |
  set -e
  # sentinel: a parallel session re-syncing ~/sky_workdir would clobber the code
  grep -q "Offline detour augmentation" ~/sky_workdir/scripts/augment.py || { echo "STALE SYNC"; exit 1; }
  JOB=~/v12eval
  rm -rf $JOB; mkdir -p $JOB
  rsync -a --exclude .venv --exclude outputs --exclude wandb ~/sky_workdir/ $JOB/
  cd $JOB && uv sync
  # hover probes vs v3 baseline (0.562): ODE steps, latent values, warm start
  CKPT=/home/sky/v12job/outputs/franka/2026-07-06/18-21-13
  E="uv run scripts/eval.py --repo_id reece-omahoney/franka --episodes 2 --env.type franka --env.task_time 1.5 --episode_seconds 30 --checkpoint $CKPT --n_action_steps 75 --env.obstacle true --env.sample_wall_margin 0.15 --best_of 16 --selector_cap 0.10 --selector_prog 0.01"
  $E --cond optimize --warm_start_t 0.6
  $E --cond optimize --warm_start_t 0.6 --num_inference_steps 50
  $E --cond 0,0,0.3,0.28 --warm_start_t 0.6
  $E --cond optimize --warm_start_t 0

