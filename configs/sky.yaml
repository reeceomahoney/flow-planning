name: flow-planning

resources:
  infra: ssh/ori
  accelerators: RTX4090:2
  cpus: 30

envs:
  HF_TOKEN:
  WANDB_API_KEY:
  CUDA_VISIBLE_DEVICES: 1
workdir: .

setup: |
  curl -LsSf https://astral.sh/uv/install.sh | sh
  source $HOME/.local/bin/env
  cd ~/sky_workdir
  uv sync

run: |
  set -e
  # sentinel: a parallel session re-syncing ~/sky_workdir would clobber the code
  grep -q "CARRIAGE HEIGHT" ~/sky_workdir/flow_planning/envs/franka.py || { echo "STALE SYNC"; exit 1; }
  JOB=~/bendjob
  rm -rf $JOB.prev; [ -d $JOB ] && mv $JOB $JOB.prev
  mkdir -p $JOB
  rsync -a --exclude .venv --exclude outputs --exclude wandb ~/sky_workdir/ $JOB/
  cd $JOB && uv sync
  rm -rf /home/sky/.cache/huggingface/lerobot/reece-omahoney/franka
  uv run scripts/record.py --env.type franka --env.task_time 1.5 --env.bend_frac 0.9 --env.bend_amp 1.0 --env.grasp_symmetry false --episodes 1536
  uv run scripts/train.py --repo_id reece-omahoney/franka --num_iters 75000 --env.type franka --env.task_time 1.5
  uv run scripts/train_guidance.py --repo_id reece-omahoney/franka
  E="uv run scripts/eval.py --repo_id reece-omahoney/franka --episodes 2 --env.type franka --env.bend_amp 1.0 --env.task_time 1.5 --episode_seconds 30 --learned_guidance_ckpt none"
  $E --cond=0,0,0.3,0.12 --warm_start_t 0.6
  GRID="0,0,0.15,0.28;0,0,0.45,0.28;-0.85,0,0.15,0.28;-0.85,0,0.45,0.28;0,0.6,0.45,0.28;0,0.6,0.15,0.28"
  O="$E --env.obstacle true --selector analytic --warm_start_t 0.6 --cond search --best_of 16 --selector_cap 0.10 --selector_prog 0.01 --cond_grid=$GRID"
  $O --env.sample_wall_margin 0.15
  $O

