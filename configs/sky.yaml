name: flow-planning

resources:
  infra: ssh/ori
  accelerators: RTX4090:2
  cpus: 30

envs:
  HF_TOKEN:
  WANDB_API_KEY:
  CUDA_VISIBLE_DEVICES: 1
  HF_DATASETS_DISABLE_PROGRESS_BARS: 1
workdir: .

setup: |
  curl -fsSL https://pixi.sh/install.sh | sh
  export PATH="$HOME/.pixi/bin:$PATH"
  cd ~/sky_workdir && pixi install

run: |
  export PATH="$HOME/.pixi/bin:$PATH"
  export LD_LIBRARY_PATH="$PWD/.pixi/envs/default/lib:$LD_LIBRARY_PATH"

  bash scripts/pipeline.sh

  EVAL="pixi run python scripts/eval.py --env.type franka \
    --repo_id reece-omahoney/franka"

  echo "=== obstacle (0.25m wall, feasible instances) ==="
  $EVAL --env.obstacle true 2>&1 | grep -v "it/s"

  echo "=== free space ==="
  $EVAL --cond null 2>&1 | grep -v "it/s"
