name: flow-planning

resources:
  infra: ssh/ori
  accelerators: RTX4090:2
  cpus: 30

envs:
  HF_TOKEN:
  WANDB_API_KEY:
  CUDA_VISIBLE_DEVICES: 1
  HF_DATASETS_DISABLE_PROGRESS_BARS: 1
workdir: .

setup: |
  curl -fsSL https://pixi.sh/install.sh | sh
  export PATH="$HOME/.pixi/bin:$PATH"
  cd ~/sky_workdir && pixi install

run: |
  set -e
  export PATH="$HOME/.pixi/bin:$PATH"
  export LD_LIBRARY_PATH="$PWD/.pixi/envs/default/lib:$LD_LIBRARY_PATH"

  CACHE=~/.cache/huggingface/lerobot/reece-omahoney

  [ -d $CACHE/franka-src ] || pixi run python scripts/record.py --env.type franka \
    --env.world_count 256 --env.task_time 1.5 --episodes 768 \
    --repo_id reece-omahoney/franka-src

  rm -rf $CACHE/franka
  pixi run python scripts/augment.py \
    --src_repo reece-omahoney/franka-src --dst_repo reece-omahoney/franka

  mkdir -p outputs
  pixi run python scripts/play.py --repo_id reece-omahoney/franka \
    --env.world_count 1 --env.task_time 1.5 --episodes 0,-1,-2,-3,-4,-5 \
    --video outputs/franka.mp4
