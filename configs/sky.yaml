name: flow-planning

resources:
  infra: ssh/ori
  accelerators: RTX4090:2
  cpus: 30

envs:
  HF_TOKEN:
  WANDB_API_KEY:
  CUDA_VISIBLE_DEVICES: 1
workdir: .

setup: |
  curl -LsSf https://astral.sh/uv/install.sh | sh
  source $HOME/.local/bin/env
  cd ~/sky_workdir
  uv sync

run: |
  set -e
  # sentinel: a parallel session re-syncing ~/sky_workdir would clobber the code
  grep -q "Offline detour augmentation" ~/sky_workdir/scripts/augment.py || { echo "STALE SYNC"; exit 1; }
  JOB=~/v12eval
  rm -rf $JOB; mkdir -p $JOB
  rsync -a --exclude .venv --exclude outputs --exclude wandb ~/sky_workdir/ $JOB/
  cd $JOB && uv sync
  # supply-side clearance: retrain with wider arc (vert_hi 1.3) + wrist (0.45) so
  # high-clearance crossings exist for selection. vs current best 0.77 obstacle.
  C=/home/sky/.cache/huggingface/lerobot/reece-omahoney
  [ -f $C/franka-src/meta/info.json ] || { echo "NO franka-src CACHE"; exit 1; }
  rm -rf $C/franka-arc
  uv run scripts/augment.py --src_repo reece-omahoney/franka-src --dst_repo reece-omahoney/franka-arc --copies 3 --env.world_count 256 --vert_hi 1.3 --wrist_hi 0.45
  uv run scripts/train.py --repo_id reece-omahoney/franka-arc --num_iters 75000 --env.type franka --env.task_time 1.5
  GHI="0,0.3,0.3,0.42;0,0.9,0.3,0.42;-0.85,0.3,0.3,0.42;-0.85,0.9,0.3,0.42;0.85,0.3,0.3,0.42;0.85,0.9,0.3,0.42"
  E="uv run scripts/eval.py --repo_id reece-omahoney/franka-arc --episodes 2 --env.type franka --env.task_time 1.5 --episode_seconds 30 --n_action_steps 75 --warm_start_t 0.6 --best_of 16 --selector_cap 0.10 --selector_prog 0.01"
  $E                                                                  # free space (parity)
  $E --env.obstacle true --env.sample_wall_margin 0.15 --cond search --cond_grid=$GHI  # high-clearance grid
  $E --env.obstacle true --env.sample_wall_margin 0.15 --cond search --n_cond 8 --cond_reduce kmeans  # scalable

