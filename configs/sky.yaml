name: flow-planning

resources:
  infra: ssh/ori
  accelerators: RTX4090:1
  cpus: 31

envs:
  HF_TOKEN:
  WANDB_API_KEY:
  CUDA_VISIBLE_DEVICES: 1
  HF_DATASETS_DISABLE_PROGRESS_BARS: 1
  CMAKE_POLICY_VERSION_MINIMUM: 3.5
  ARM: detaug
  ITERS: 20000
  SEEDS: "0 1 2"
  AUGS: "16 32 64 128"
  ORIG: 64
  NCOND: 8
  CSCALE: 1.0
workdir: .

setup: |
  curl -fsSL https://pixi.sh/install.sh | sh
  export PATH="$HOME/.pixi/bin:$PATH"
  cd ~/sky_workdir && pixi install

run: |
  export PATH="$HOME/.pixi/bin:$PATH"
  SNAP=$(mktemp -d ~/snap.XXXXXX)
  rsync -a --exclude .pixi --exclude outputs --exclude wandb ~/sky_workdir/ $SNAP/
  ln -s ~/sky_workdir/.pixi $SNAP/.pixi; ln -s ~/sky_workdir/outputs $SNAP/outputs
  cd $SNAP
  grep -q aug_episodes scripts/train.py || { echo "stale workdir"; exit 1; }
  export LD_LIBRARY_PATH="$PWD/.pixi/envs/default/lib:$LD_LIBRARY_PATH"
  BASE=outputs/franka/2026-08-13/02-10-06
  if [ "$ARM" = demogen ]; then
    REPO=reece-omahoney/franka-demogen-pc
    TRAIN="--cond_dim 0 --cloud_points 256"; C="--cond cloud --n_cond 1"; FREE="--cond cloud"
  else
    REPO=reece-omahoney/franka-transit
    TRAIN=""; C="--cond search --n_cond $NCOND --cond_scale $CSCALE"; FREE="--cond zero"
  fi
  ev() { echo "##### $1"; shift; pixi run python scripts/eval.py --env.type franka --env.world_count 128 --episodes 1 \
    --repo_id $REPO "$@" 2>&1 | grep -E "^overall|contacts|latched|cloud cond|Error|Traceback|File \"/home/sky/snap"; }
  for SEED in $SEEDS; do for N in $AUGS; do
    RUN=outputs/franka/ft2/$ARM-a$N-s$SEED
    [ -f $RUN/evals.done ] && continue
    echo "##### train $RUN"
    [ -f $RUN/model.safetensors ] || pixi run python scripts/train.py --env.type franka --repo_id $REPO \
      --init_from $BASE --freeze_backbone true --aug_episodes $N --orig_episodes $ORIG --seed $SEED \
      --num_iters $ITERS --eval_every 0 --run_dir $RUN $TRAIN 2>&1 | grep -vE "it/s|Warning"
    ev "$RUN wall" --checkpoint $RUN --seed $SEED --env.obstacle true $C
    ev "$RUN wall-dy" --checkpoint $RUN --seed $SEED --env.obstacle true --env.obstacle_dy -0.08 $C
    ev "$RUN wall-dx" --checkpoint $RUN --seed $SEED --env.obstacle true --env.obstacle_dx 0.1 $C
    ev "$RUN free" --checkpoint $RUN --seed $SEED --env.obstacle false $FREE
    touch $RUN/evals.done
  done; done
  rm -rf $SNAP
