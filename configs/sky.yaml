name: flow-planning

resources:
  infra: ssh/ori
  accelerators: RTX4090:2
  cpus: 30

envs:
  HF_TOKEN:
  WANDB_API_KEY:
  CUDA_VISIBLE_DEVICES: 1
workdir: .

setup: |
  curl -LsSf https://astral.sh/uv/install.sh | sh
  source $HOME/.local/bin/env
  cd ~/sky_workdir && uv sync

run: |
  set -e
  # snapshot first: a parallel session re-syncing ~/sky_workdir clobbers us mid-job
  JOB=~/job
  rm -rf $JOB
  rsync -a --exclude .venv --exclude outputs --exclude wandb ~/sky_workdir/ $JOB/
  cd $JOB && uv sync
  # ponytail: logs which code ran instead of asserting it; the snapshot above is
  # the real protection, this just attributes a surprising result after the fact
  git rev-parse --short HEAD 2>/dev/null || echo "no git"

  CKPT=/home/sky/v12job/outputs/franka/2026-07-06/18-21-13
  GRID="0,0,0.15,0.28;0,0,0.45,0.28;-0.85,0,0.15,0.28;-0.85,0,0.45,0.28;0,0.6,0.45,0.28;0,0.6,0.15,0.28"
  E="uv run scripts/eval.py --repo_id reece-omahoney/franka --episodes 2 \
    --env.type franka --env.task_time 1.5 --episode_seconds 30 --checkpoint $CKPT \
    --n_action_steps 75 --env.obstacle true --env.sample_wall_margin 0.15 \
    --warm_start_t 0.6 --cond search --selector_cap 0.10 --selector_prog 0.01 \
    --best_of 16"
  # round 12: divide the labour. Round 11 confirms guidance owns COLLISION
  # (0.023-0.051 on any menu, vs a selector floor of 0.145 nothing penetrated)
  # while round 5 showed path-length SELECTION owns timeout (0.133, best of any
  # data config). They currently fight: cap/prog latching picks an evasive mode
  # and guidance piles on more. Here selection picks the SHORTEST mode and
  # leaves clearance entirely to guidance. Note round 11C: length as a guidance
  # GRADIENT is harmful, so the length pressure must live in selection only.
  GU="--guidance_margin 0.1 --guidance_scale 0.3 --guidance_target xt"
  for M in 0.005 0.02 0.04; do
    echo "=== data, shortest-path latch margin $M + guidance ==="
    $E --cond search --n_cond 6 --best_of 1 --selector_margin $M $GU
  done
  echo "=== same on the hand grid, for the ceiling ==="
  $E --cond search --cond_grid=$GRID --best_of 1 --selector_margin 0.04 $GU
