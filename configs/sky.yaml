name: flow-planning

resources:
  infra: ssh/ori
  accelerators: RTX4090:2
  cpus: 30

envs:
  HF_TOKEN:
  WANDB_API_KEY:
  CUDA_VISIBLE_DEVICES: 1
workdir: .

setup: |
  curl -LsSf https://astral.sh/uv/install.sh | sh
  source $HOME/.local/bin/env
  cd ~/sky_workdir && uv sync

run: |
  set -e
  # snapshot first: a parallel session re-syncing ~/sky_workdir clobbers us mid-job
  JOB=~/job
  rm -rf $JOB
  rsync -a --exclude .venv --exclude outputs --exclude wandb ~/sky_workdir/ $JOB/
  cd $JOB && uv sync
  # ponytail: logs which code ran instead of asserting it; the snapshot above is
  # the real protection, this just attributes a surprising result after the fact
  git rev-parse --short HEAD 2>/dev/null || echo "no git"

  CKPT=/home/sky/v12job/outputs/franka/2026-07-06/18-21-13
  GRID="0,0,0.15,0.28;0,0,0.45,0.28;-0.85,0,0.15,0.28;-0.85,0,0.45,0.28;0,0.6,0.45,0.28;0,0.6,0.15,0.28"
  E="uv run scripts/eval.py --repo_id reece-omahoney/franka --episodes 2 \
    --env.type franka --env.task_time 1.5 --episode_seconds 30 --checkpoint $CKPT \
    --n_action_steps 75 --env.obstacle true --env.sample_wall_margin 0.15 \
    --warm_start_t 0.6 --cond search --selector_cap 0.10 --selector_prog 0.01 \
    --best_of 16"
  # round 9: guidance, retuned with what rounds 5-7 established. July's peak was
  # 0.727 (collision 0.027 — five times better than any selector floor) but it
  # stalled at timeout 0.25. Two fixes: margin at the measured saturation point
  # (0.04, was 0.10 — it was buying clearance that buys nothing) and a path-length
  # term so the gradient cannot pay for clearance with unbounded detour. Also
  # guide the predicted CLEAN trajectory with (1-t) scaling, as the source paper
  # did and the lit calls most robust, instead of the raw noisy x_t.
  G="--cond search --n_cond 6 --best_of 1 --selector_margin 0.04 --guidance_margin 0.04"
  echo "=== A: x1 target, no length, scale 0.3 ==="
  $E $G --guidance_target x1 --guidance_scale 0.3
  echo "=== B: x1 target, no length, scale 1.0 ==="
  $E $G --guidance_target x1 --guidance_scale 1.0
  echo "=== C: x1 target, length 0.3, scale 1.0 ==="
  $E $G --guidance_target x1 --guidance_scale 1.0 --guidance_len 0.3
  echo "=== D: xt target (old), no length, scale 0.3 — isolates the margin change ==="
  $E $G --guidance_target xt --guidance_scale 0.3
