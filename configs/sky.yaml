name: flow-planning

resources:
  infra: ssh/ori
  accelerators: RTX4090:2
  cpus: 30

envs:
  HF_TOKEN:
  WANDB_API_KEY:
  CUDA_VISIBLE_DEVICES: 1
workdir: .

setup: |
  curl -LsSf https://astral.sh/uv/install.sh | sh
  source $HOME/.local/bin/env
  cd ~/sky_workdir && uv sync

run: |
  set -e
  # snapshot first: a parallel session re-syncing ~/sky_workdir clobbers us mid-job
  JOB=~/job-${SKYPILOT_TASK_ID:-$$}  # unique: two queued jobs must not share it
  rm -rf $JOB
  rsync -a --exclude .venv --exclude outputs --exclude wandb ~/sky_workdir/ $JOB/
  cd $JOB && uv sync
  git rev-parse --short HEAD 2>/dev/null || echo "no git"

  # Round 30: WHAT DO THE TIMEOUTS DO? Every lever tried converts collisions
  # into timeout at the same rate, but the timeout bucket has never been broken
  # down -- the stage histogram is unconditional, so timeouts and collisions are
  # mixed in it. New `stage|timeout` / `stage|failure` lines in eval.py.
  # Taxonomy: none = never grasped | grasped = lifted, never reached goal xy |
  # over_goal = above goal, never within success_dist | placed = at goal, never
  # released. Which dominates decides whether the conversion is a routing stall
  # (grasped), a descent problem (over_goal), or a release problem (placed).
  CKPT=/home/sky/v12job/outputs/franka/2026-07-06/18-21-13
  GRID="0,0,0.15,0.28;0,0,0.45,0.28;-0.85,0,0.15,0.28;-0.85,0,0.45,0.28;0,0.6,0.45,0.28;0,0.6,0.15,0.28"
  B="uv run scripts/eval.py --repo_id reece-omahoney/franka --episodes 4 \
    --env.type franka --env.task_time 1.5 --episode_seconds 30 --checkpoint $CKPT \
    --n_action_steps 75 --env.obstacle true --env.sample_wall_margin 0.15 \
    --warm_start_t 0.6 --cond search"

  echo "=== A: free space, cond 0,0,0.3,0.2 (0.918) -- timeout baseline ==="
  uv run scripts/eval.py --repo_id reece-omahoney/franka --episodes 4 \
    --env.type franka --env.task_time 1.5 --episode_seconds 30 --checkpoint $CKPT \
    --n_action_steps 75 --cond 0,0,0.3,0.2

  echo "=== B: h 0.20, grid + cap/prog, best_of 16 (0.773 / timeout 0.086) ==="
  $B --selector_cap 0.10 --selector_prog 0.01 --best_of 16 --cond_grid "$GRID"

  echo "=== C: h 0.20, grid-free 24x4 + margin 0.04 (0.708 / timeout 0.129) ==="
  $B --n_cond 24 --best_of 4 --selector_margin 0.04

  echo "=== D: h 0.25, 24x4 + margin 0.04 + radii (0.383 / timeout 0.137) ==="
  $B --n_cond 24 --best_of 4 --selector_margin 0.04 --selector_radii true \
    --env.obstacle_height 0.25
