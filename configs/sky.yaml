name: flow-planning

resources:
  infra: ssh/ori
  accelerators: RTX4090:1
  cpus: 31

envs:
  HF_TOKEN:
  WANDB_API_KEY:
  CUDA_VISIBLE_DEVICES: 1
  MUJOCO_GL: egl
  HF_DATASETS_DISABLE_PROGRESS_BARS: 1
  CMAKE_POLICY_VERSION_MINIMUM: 3.5
  SMOKE: 0
  ITERS: 40000
  TAG: chunk
workdir: .

setup: |
  curl -fsSL https://pixi.sh/install.sh | sh
  export PATH="$HOME/.pixi/bin:$PATH"
  cd ~/sky_workdir && pixi install

run: |
  export PATH="$HOME/.pixi/bin:$PATH"
  SNAP=$(mktemp -d ~/snap.XXXXXX)
  rsync -a --exclude .pixi --exclude outputs --exclude wandb ~/sky_workdir/ $SNAP/
  ln -s ~/sky_workdir/.pixi $SNAP/.pixi; mkdir -p ~/sky_workdir/outputs; ln -s ~/sky_workdir/outputs $SNAP/outputs
  cd $SNAP
  grep -q task_onehot flow_planning/envs/libero.py || { echo "stale workdir"; exit 1; }
  export LD_LIBRARY_PATH="$PWD/.pixi/envs/default/lib:$LD_LIBRARY_PATH"
  CACHE=~/.cache/huggingface/lerobot/reece-omahoney
  ENV="--env.type libero --env.suite safelibero_spatial --env.task_onehot 4 --env.n_action_steps 10"
  q() { "$@" 2>&1 | grep --line-buffered -vE "it/s|Warning|examples/s|EGL|egl_|OpenGL|glCheck|binding_utils|raise self|^\s*$"; }
  if [ "$SMOKE" = 1 ]; then REPO=spatial_smoke; AUG="--limit 2 --copies 1 --orig_copies 1"; ITERS=50; EPS=1; RUN=outputs/libero/smoke; rm -rf $CACHE/$REPO $RUN
  else REPO=spatial_$TAG; AUG="--copies 6 --orig_copies 5"; EPS=10; RUN=outputs/libero/spatial_$TAG; fi
  [ -d $CACHE/$REPO ] || q pixi run python scripts/augment.py $ENV --env.level I --task_ids "[0,1,2,3]" \
    --dst_repo reece-omahoney/$REPO --bend_margin 0.4 --focus true --retarget 0.25 --retarget_place 0.12 --retarget_only 0.15 $AUG
  echo "##### train $RUN"
  [ -f $RUN/model.safetensors ] || q pixi run python scripts/train.py $ENV --repo_id reece-omahoney/$REPO \
    --horizon 50 --num_iters $ITERS --eval_every 0 --run_dir $RUN
  ev() { echo "##### $1"; shift; pixi run python scripts/eval.py $ENV --env.world_count 5 --episodes $EPS \
    --repo_id reece-omahoney/$REPO --checkpoint $RUN "$@" 2>&1 | grep -E "^overall|resampling|Error|Traceback|File \"/home"; }
  for T in 0 1 2 3; do for L in I II; do
    ev "task $T level $L search-resample" --env.task_id $T --env.level $L --env.obstacle true --cond search --n_cond 8 --resample true
    ev "task $T level $L zero" --env.task_id $T --env.level $L --env.obstacle true --cond zero
  done; done
  rm -rf $SNAP
