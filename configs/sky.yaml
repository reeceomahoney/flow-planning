name: flow-planning

resources:
  infra: ssh/ori
  accelerators: RTX4090:1
  cpus: 31

envs:
  HF_TOKEN:
  WANDB_API_KEY:
  CUDA_VISIBLE_DEVICES: 1
  HF_DATASETS_DISABLE_PROGRESS_BARS: 1
  CMAKE_POLICY_VERSION_MINIMUM: 3.5
workdir: .

setup: |
  curl -fsSL https://pixi.sh/install.sh | sh
  export PATH="$HOME/.pixi/bin:$PATH"
  cd ~/sky_workdir && pixi install

run: |
  export PATH="$HOME/.pixi/bin:$PATH"
  export LD_LIBRARY_PATH="$PWD/.pixi/envs/default/lib:$LD_LIBRARY_PATH"
  SUITE=safelibero_object
  TASKS="0 1 2 3"
  export TAG=aug8 COPIES=20 ITERS=40000 EPISODES=50
  export AUG_ARGS="--focus true --orig_copies 5 --retarget 0.25 --retarget_place 0.12 --retarget_only 0.15"
  run() { LEVELS="$1" bash scripts/pipeline_libero.sh $SUITE $T 2>&1 | grep -vE "it/s\]|Warning|WARNING|macro"; }
  for T in $TASKS; do
    echo "##### $SUITE task $T"
    if [ "$SUITE $T" = "safelibero_goal 3" ]; then
      run I; run II
    else
      run "I II"
    fi
  done
