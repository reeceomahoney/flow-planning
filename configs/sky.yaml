name: flow-planning

resources:
  infra: ssh/ori
  accelerators: RTX4090:2
  cpus: 30

envs:
  HF_TOKEN:
  WANDB_API_KEY:
  CUDA_VISIBLE_DEVICES: 1
workdir: .

setup: |
  curl -LsSf https://astral.sh/uv/install.sh | sh
  source $HOME/.local/bin/env
  cd ~/sky_workdir && uv sync

run: |
  set -e
  # snapshot first: a parallel session re-syncing ~/sky_workdir clobbers us mid-job
  JOB=~/job
  rm -rf $JOB
  rsync -a --exclude .venv --exclude outputs --exclude wandb ~/sky_workdir/ $JOB/
  cd $JOB && uv sync
  # ponytail: logs which code ran instead of asserting it; the snapshot above is
  # the real protection, this just attributes a surprising result after the fact
  git rev-parse --short HEAD 2>/dev/null || echo "no git"

  CKPT=/home/sky/v12job/outputs/franka/2026-07-06/18-21-13
  GRID="0,0,0.15,0.28;0,0,0.45,0.28;-0.85,0,0.15,0.28;-0.85,0,0.45,0.28;0,0.6,0.45,0.28;0,0.6,0.15,0.28"
  E="uv run scripts/eval.py --repo_id reece-omahoney/franka --episodes 2 \
    --env.type franka --env.task_time 1.5 --episode_seconds 30 --checkpoint $CKPT \
    --n_action_steps 75 --env.obstacle true --env.sample_wall_margin 0.15 \
    --warm_start_t 0.6 --cond search --selector_cap 0.10 --selector_prog 0.01 \
    --best_of 16"
  # round 5: flip the optimization. Clearance becomes a hard constraint and
  # joint-space path length the objective — shortest route that clears. No
  # weight between the two, so this cannot reproduce the collision/timeout
  # trade every weighted term has traced. prog rewarded the arc for closing
  # distance early; path length charges it for going up and over.
  for M in 0.04 0.06 0.08 0.10; do
    echo "=== data, margin $M, min path length ==="
    $E --n_cond 6 --best_of 16 --selector_margin $M
  done
