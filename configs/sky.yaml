name: flow-planning

resources:
  infra: ssh/ori
  accelerators: RTX4090:2
  cpus: 30

envs:
  HF_TOKEN:
  WANDB_API_KEY:
  CUDA_VISIBLE_DEVICES: 1
workdir: .

setup: |
  curl -LsSf https://astral.sh/uv/install.sh | sh
  source $HOME/.local/bin/env
  cd ~/sky_workdir
  uv sync

run: |
  set -e
  # sentinel: a parallel session re-syncing ~/sky_workdir would clobber the code
  grep -q "Offline detour augmentation" ~/sky_workdir/scripts/augment.py || { echo "STALE SYNC"; exit 1; }
  JOB=~/v12eval
  rm -rf $JOB; mkdir -p $JOB
  rsync -a --exclude .venv --exclude outputs --exclude wandb ~/sky_workdir/ $JOB/
  cd $JOB && uv sync
  # ABLATION: collision-cost guidance vs the best-of-N selector. Same ckpt/env,
  # same warm-start; only the collision-handling mechanism changes.
  CKPT=/home/sky/v12job/outputs/franka/2026-07-06/18-21-13
  GRID="0,0,0.15,0.28;0,0,0.45,0.28;-0.85,0,0.15,0.28;-0.85,0,0.45,0.28;0,0.6,0.45,0.28;0,0.6,0.15,0.28"
  E="uv run scripts/eval.py --repo_id reece-omahoney/franka --episodes 2 --env.type franka --env.task_time 1.5 --episode_seconds 30 --checkpoint $CKPT --n_action_steps 75 --env.obstacle true --env.sample_wall_margin 0.15 --warm_start_t 0.6"
  SEL="--cond search --cond_grid=$GRID --selector_cap 0.10 --selector_prog 0.01"
  # reference: best-of-N selector + cond search (the current best, ~0.77)
  $E $SEL --best_of 16
  # fair guidance: SAME latent (cond search latches the mode), best-of-1, guidance
  # replaces the best-of-N filtering — the only variable is selection vs guidance
  for GS in 0.2 0.4 0.5; do
    echo "=== cond-search guidance_scale $GS ==="
    $E $SEL --best_of 1 --guidance_scale $GS --guidance_margin 0.1
  done

