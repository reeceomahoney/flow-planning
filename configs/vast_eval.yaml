name: flow-planning

resources:
  infra: vast
  accelerators: RTX5090:1
  cpus: 16+
  memory: 32+
  disk_size: 60
  image_id: docker:nvidia/cuda:13.0.3-runtime-ubuntu22.04

envs:
  HF_TOKEN:
  WANDB_API_KEY:
  MUJOCO_GL: egl
  HF_DATASETS_DISABLE_PROGRESS_BARS: 1
  CMAKE_POLICY_VERSION_MINIMUM: 3.5
  NAMES: "spatial_recflagna spatial_posefna"
  CELLS: "1_I 1_II 2_I 2_II 3_I 3_II"
  ARMS: "n32Hdev"
  PAR: 3
workdir: .

setup: |
  DRV=$(nvidia-smi --query-gpu=driver_version --format=csv,noheader | cut -d. -f1)
  [ "$DRV" -ge 580 ] || { echo "driver $DRV too old"; exit 1; }
  apt-get update -qq && apt-get install -y -qq curl git build-essential linux-libc-dev libegl1 libgl1 libglib2.0-0 > /dev/null
  curl -fsSL https://pixi.sh/install.sh | sh
  export PATH="$HOME/.pixi/bin:$PATH"
  cd ~/sky_workdir && pixi install

run: |
  export PATH="$HOME/.pixi/bin:$PATH"
  SNAP=$(mktemp -d ~/snap.XXXXXX)
  rsync -a --exclude .pixi --exclude outputs --exclude wandb ~/sky_workdir/ $SNAP/
  ln -s ~/sky_workdir/.pixi $SNAP/.pixi; mkdir -p ~/sky_workdir/outputs; ln -s ~/sky_workdir/outputs $SNAP/outputs
  cd $SNAP
  grep -q "deviation" scripts/eval.py || { echo "stale workdir"; exit 1; }
  export LD_LIBRARY_PATH="$PWD/.pixi/envs/default/lib:$LD_LIBRARY_PATH"
  ENV="--env.type libero --env.suite safelibero_spatial --env.task_onehot 4 --env.n_action_steps 10 --env.world_count 10"
  ENS="--ensemble 3 --ensemble_m 0.7"
  SEARCH="--cond search --n_cond 8 --resample true $ENS"
  CBF="--cbf true --cbf_chunk true --cbf_init 20 --cbf_hold 0.09 --cbf_geoms true --cbf_axes 0.04,0.11,0.075 --cbf_offset 0,0,-0.056 --cbf_margin 0.0"
  arm_args() { case $1 in
    searchE) echo "--env.obstacle true $SEARCH";;
    n32Hdev) echo "--env.obstacle true $SEARCH --hold 0.09 --n_cond 32 --deviation 0.0005";;
    tight) echo "--env.obstacle true $SEARCH $CBF";;
    zeroE) echo "--env.obstacle true --cond zero $ENS";;
    free) echo "--env.obstacle false --cond zero $ENS";;
  esac; }
  run() { # NAME ARM CELL
    OUT=outputs/eval_$1; mkdir -p $OUT; f=$OUT/$2_$3.log
    grep -q "^overall" $f 2>/dev/null && { echo "skip $f"; return; }
    t=${3%_*}; l=${3#*_}
    OMP_NUM_THREADS=2 pixi run python scripts/eval.py $ENV --env.task_id $t --env.level $l \
      --repo_id reece-omahoney/$1 --checkpoint outputs/libero/$1 --episodes 5 $(arm_args $2) > $f 2>&1
    echo "done $f $(grep -aE '^overall' $f | tr '\n' ' ')"
  }
  export -f run arm_args; export ENV ENS SEARCH CBF
  for N in $NAMES; do
    [ -f outputs/libero/$N/model.safetensors ] || { echo "missing checkpoint $N"; continue; }
    { for A in $ARMS; do for C in $CELLS; do echo "$N $A $C"; done; done; for T in 1 2 3; do echo "$N free ${T}_I"; done; } \
      | xargs -P $PAR -L 1 bash -c 'run "$@"' _
  done
  for N in $NAMES; do for f in outputs/eval_$N/*.log; do echo "$N $(basename $f .log) $(grep -aE '^overall' $f | tr '\n' ' ')"; done; done
  rm -rf $SNAP
