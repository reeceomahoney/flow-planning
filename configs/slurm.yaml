clusters:
  civo:
    host: civo
    remote_path: /users/kebl6123/flow-planning
    time: 12
    gpu: nvidia_a100-sxm4-80gb
    ngpu: 1
    cpus: 12
    mem: 4G
    partition: a100

envs:
  - HF_TOKEN
  - WANDB_API_KEY
  - MUJOCO_GL: egl
  - CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  - HF_DATASETS_DISABLE_PROGRESS_BARS: "1"
  - PYTHONUNBUFFERED: "1"
  - SUITE: safelibero_object
  - TASKS: "0 1 2 3"
  - TAG: aug4
  - COPIES: "20"
  - ITERS: "40000"
  - EPISODES: "50"
  - LEVELS: "I II"
  - AUG_ARGS: "--focus true --orig_copies 5"

command: |-
  export PATH=$HOME/.pixi/bin:$PATH
  for T in $TASKS; do
    cp scripts/pipeline_libero.sh /tmp/pipe_${SLURM_JOB_ID}_$T.sh
    bash /tmp/pipe_${SLURM_JOB_ID}_$T.sh $SUITE $T 2>&1 |
      grep --line-buffered -vE 'it/s\]|Warning|WARNING|macro'
  done
