name: flow-planning

resources:
  infra: ssh/ori
  accelerators: RTX4090:1
  cpus: 8

envs:
  HF_TOKEN:
  WANDB_API_KEY:
  CUDA_VISIBLE_DEVICES: 1
  MUJOCO_GL: egl
  HF_DATASETS_DISABLE_PROGRESS_BARS: 1
  CMAKE_POLICY_VERSION_MINIMUM: 3.5
  LEVEL: I
  TASKS: "0 1 2 3"
  N_INITS: 20
workdir: .
setup: |
  curl -fsSL https://pixi.sh/install.sh | sh
  export PATH="$HOME/.pixi/bin:$PATH"
  cd ~/sky_workdir && pixi install

run: |
  export PATH="$HOME/.pixi/bin:$PATH"
  SNAP=$(mktemp -d ~/snap.XXXXXX)
  rsync -a --exclude .pixi --exclude outputs --exclude wandb ~/sky_workdir/ $SNAP/
  ln -s ~/sky_workdir/.pixi $SNAP/.pixi; mkdir -p ~/sky_workdir/outputs; ln -s ~/sky_workdir/outputs $SNAP/outputs
  cd $SNAP
  grep -q "def solve_windows" scripts/check_grasp.py || { echo "stale workdir"; exit 1; }
  export LD_LIBRARY_PATH="$PWD/.pixi/envs/default/lib:$LD_LIBRARY_PATH"
  export OMP_NUM_THREADS=4
  ENV="--env.type libero --env.suite safelibero_spatial --env.world_count 10"
  q() { "$@" 2>&1 | grep --line-buffered -vE "it/s|Warning|examples/s|EGL|egl_|OpenGL|glCheck|binding_utils|raise self|^\s*$"; }
  mkdir -p outputs/check_grasp
  echo "##### smoke"
  q pixi run python scripts/check_grasp.py $ENV --env.task_id 2 --env.level $LEVEL --n_demos 2 --n_inits 10 --out outputs/check_grasp/smoke
  for T in $TASKS; do
    echo "##### task $T level $LEVEL"
    q pixi run python scripts/check_grasp.py $ENV --env.task_id $T --env.level $LEVEL --n_inits $N_INITS 2>&1 | tee outputs/check_grasp/${T}_${LEVEL}.log | grep -E "^task|^inits|RESULT|Error|Traceback|File \"/home"
  done
  grep -h RESULT outputs/check_grasp/*_${LEVEL}.log
  rm -rf $SNAP
