name: flow-check

resources:
  infra: ssh/ori
  accelerators: RTX4090:0.5
  cpus: 6

envs:
  HF_TOKEN:
  CUDA_VISIBLE_DEVICES: 1
  HF_DATASETS_DISABLE_PROGRESS_BARS: 1
  CMAKE_POLICY_VERSION_MINIMUM: 3.5
  SUITE: safelibero_goal
  TASKS: "0 1 2 3"
  LEVELS: "I II"
  ARGS: ""
workdir: .

run: |
  export PATH="$HOME/.pixi/bin:$PATH"
  export LD_LIBRARY_PATH="$PWD/.pixi/envs/default/lib:$LD_LIBRARY_PATH"
  for T in $TASKS; do for L in $LEVELS; do
    echo "##### $SUITE task $T level $L"
    pixi run python scripts/check_aug.py --env.type libero --env.suite $SUITE --env.task_id $T \
      --env.level $L $ARGS 2>&1 | grep -vE "it/s\]|Warning|WARNING|macro"
  done; done
