name: flow-suite

resources:
  infra: ssh/ori
  accelerators: RTX4090:0.5
  cpus: 7

envs:
  HF_TOKEN:
  WANDB_API_KEY:
  CUDA_VISIBLE_DEVICES: 1
  HF_DATASETS_DISABLE_PROGRESS_BARS: 1
  CMAKE_POLICY_VERSION_MINIMUM: 3.5
  SUITE: safelibero_goal
  TASKS: "0 1 2 3"
  TRAIN: 1
  COPIES: 6
  ITERS: 20000
  EPISODES: 10
workdir: .

run: |
  export PATH="$HOME/.pixi/bin:$PATH"
  export LD_LIBRARY_PATH="$PWD/.pixi/envs/default/lib:$LD_LIBRARY_PATH"
  for T in $TASKS; do
    LV="I II"
    [ "$SUITE $T" = "safelibero_goal 3" ] && LV="I|II"
    for L in ${LV//|/ }; do
      [ "$LV" = "I II" ] && L="I II"
      echo "##### $SUITE task $T levels $L"
      LEVELS="$L" bash scripts/pipeline_libero.sh $SUITE $T 2>&1 | grep -vE "it/s\]|Warning|WARNING|macro"
      [ "$LV" = "I II" ] && break
    done
  done
