name: flow-suite

resources:
  infra: ssh/ori
  accelerators: RTX4090:0.5
  cpus: 7

envs:
  HF_TOKEN:
  WANDB_API_KEY:
  CUDA_VISIBLE_DEVICES: 1
  HF_DATASETS_DISABLE_PROGRESS_BARS: 1
  CMAKE_POLICY_VERSION_MINIMUM: 3.5
  SUITE: safelibero_goal
  TASKS: "0 1 2 3"
  TRAIN: 1
  COPIES: 6
  ITERS: 20000
  EPISODES: 10
workdir: .

run: |
  export PATH="$HOME/.pixi/bin:$PATH"
  export LD_LIBRARY_PATH="$PWD/.pixi/envs/default/lib:$LD_LIBRARY_PATH"
  run() { LEVELS="$1" bash scripts/pipeline_libero.sh $SUITE $T 2>&1 | grep -vE "it/s\]|Warning|WARNING|macro"; }
  for T in $TASKS; do
    echo "##### $SUITE task $T"
    if [ "$SUITE $T" = "safelibero_goal 3" ]; then
      run I; run II
    else
      run "I II"
    fi
  done
